name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set site URL
        id: vars
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          if [ "$REPO_NAME" = "lazycatzzzzz.github.io" ]; then
            echo "BASE_PATH=" >> $GITHUB_ENV
            echo "SITE_URL=https://lazycatzzzzz.github.io" >> $GITHUB_ENV
          else
            echo "BASE_PATH=/$REPO_NAME" >> $GITHUB_ENV
            echo "SITE_URL=https://lazycatzzzzz.github.io/$REPO_NAME" >> $GITHUB_ENV
          fi

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_MINIMAX_API_KEY: ${{ secrets.NEXT_PUBLIC_MINIMAX_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
